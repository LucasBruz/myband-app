[build]
  command = "rm -rf flutter_sdk && git clone https://github.com/flutter/flutter.git -b stable --depth 1 flutter_sdk && export PATH=\"$PATH:$PWD/flutter_sdk/bin\" && flutter config --enable-web --no-analytics && flutter pub get && flutter build web --release"
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
